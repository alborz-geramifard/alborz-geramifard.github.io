<script>
document.getElementById('y').textContent = new Date().getFullYear();
const q = document.getElementById('q'), n = document.getElementById('n'), filters = document.getElementById('filters');
const pubs = [...document.querySelectorAll('.pub')].map(el => ({el, txt: el.textContent.toLowerCase(), kind: el.dataset.kind}));
let kind = 'all';
function apply() {
  const s = q.value.trim().toLowerCase(); let shown = 0;
  pubs.forEach(p => { const hit = (!s || p.txt.includes(s)) && (kind === 'all' || p.kind === kind); p.el.classList.toggle('hidden', !hit); if (hit) shown++; });
  document.querySelectorAll('.year').forEach(y => y.classList.toggle('hidden', !y.querySelector('.pub:not(.hidden)')));
  n.textContent = shown;
}
q.addEventListener('input', apply);
filters.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  kind = b.dataset.kind; [...filters.children].forEach(x => x.classList.toggle('on', x === b)); apply();
});
</script>
